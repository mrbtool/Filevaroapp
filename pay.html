<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment</title>
    <script src="https://zappay.shop/zappay-pay.js"></script>
    <style>
        body { background: #0A0F1C; color: #16A34A; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div id="status">Initializing Secure Payment...</div>
    <script>
        ZapPay.setCallbacks({
            onSuccess: function(order) {
                // Payment Success! Redirect back to the Android App to unlock premium
                document.getElementById("status").innerText = "Payment Successful! Returning to app...";
                window.location.replace("imgmrb://payment/success");
            },
            onFailed: function(order) {
                document.getElementById("status").innerText = "Payment Failed. Returning to app...";
                window.location.replace("imgmrb://payment/failed");
            },
            onTimeout: function(order) {
                document.getElementById("status").innerText = "Payment Timed Out. Returning to app...";
                window.location.replace("imgmrb://payment/failed");
            }
        });

        setTimeout(function() {
            ZapPay.createOrder({
                zap_api: 'ZPPz3iFQYkDDvxpgx4gWEi2ukF8C93RS4SX',
                amount: 1, // Set to 1 for testing
                title: 'Lifetime Premium Access'
            });
        }, 1000);
    </script>
</body>
</html>
